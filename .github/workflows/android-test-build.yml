name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Option 2 activity pulse
        run: python tool/apply_activity_pulse.py

      - name: Apply workout-only UI and calendar
        run: python tool/apply_workout_only_ui.py

      - name: Create Android runner
        run: |
          chmod +x tool/bootstrap_android.sh
          ./tool/bootstrap_android.sh

      - name: Configure preview app
        run: |
          chmod +x tool/configure_preview_android.sh
          ./tool/configure_preview_android.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: muscletrack-v030-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
