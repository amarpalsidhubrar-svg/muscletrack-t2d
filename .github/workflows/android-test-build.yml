name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build AFCD Release 3 reference data
        run: |
          python -m pip install --quiet openpyxl
          python tool/build_afcd_data.py
      - name: Prepare v0.2 sources
        run: python tool/prepare_v024_preview.py
      - name: Apply Option 2 activity pulse
        run: python tool/apply_activity_pulse.py
      - name: Apply dashboard interactions
        run: python tool/apply_dashboard_interactions.py
      - name: Apply workout-only UI and calendar
        run: python tool/apply_workout_only_ui.py
      - name: Create Android runner
        run: |
          chmod +x tool/bootstrap_android.sh
          ./tool/bootstrap_android.sh
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test calculations
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: muscletrack-v029-workout-calendar-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
