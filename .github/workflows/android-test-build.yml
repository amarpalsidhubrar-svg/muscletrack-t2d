name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unpack v0.1 source
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q source/muscletrack_t2d_v0.1_source.zip -d appsrc
      - name: Create Android runner
        working-directory: appsrc/muscletrack_v01
        run: |
          chmod +x tool/bootstrap_android.sh
          ./tool/bootstrap_android.sh
      - name: Analyze
        working-directory: appsrc/muscletrack_v01
        run: flutter analyze
      - name: Test
        working-directory: appsrc/muscletrack_v01
        run: flutter test
      - name: Build debug APK
        working-directory: appsrc/muscletrack_v01
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: muscletrack-v01-debug-apk
          path: appsrc/muscletrack_v01/build/app/outputs/flutter-apk/app-debug.apk
