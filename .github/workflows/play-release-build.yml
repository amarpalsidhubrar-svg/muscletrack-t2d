# MuscleTrack v0.3 clean workout-only Play build - final
name: Google Play signed AAB

on:
  workflow_dispatch:
  push:
    branches: [ feature/v0.2-muscle-health ]
    paths:
      - '.github/workflows/play-release-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Option 2 activity pulse
        run: python tool/apply_activity_pulse.py

      - name: Apply workout-only UI and calendar
        run: python tool/apply_workout_only_ui.py

      - name: Set Play version
        run: |
          sed -i 's/^version:.*/version: 0.3.0+10/' pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Create Android runner
        run: |
          chmod +x tool/bootstrap_android.sh
          ./tool/bootstrap_android.sh

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing ANDROID_UPLOAD_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing ANDROID_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing ANDROID_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing ANDROID_KEY_PASSWORD' && exit 1)

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 tool/configure_release_signing.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: muscletrack-v030-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
